<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nettuno Gold — Pannello contenuti</title>
    <!-- Nessuna build necessaria: il pannello (Decap CMS) è un bundle
         statico caricato da qui, indipendente dalla versione di Next.js/React
         usata dal resto del sito. Questa pagina non viene mai processata
         da Next: è servita così com'è da /public. -->
    <!-- Percorso esplicito di config.yml: senza questo tag, Decap lo
         cercherebbe con un percorso relativo alla pagina corrente, che
         fallisce se l'URL è "/admin" senza slash finale. -->
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </body>
</html>
