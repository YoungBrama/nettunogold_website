# ============================================================================
# CONFIGURAZIONE PANNELLO CONTENUTI (Decap CMS) — Nettuno Gold
# ============================================================================
# Questo file definisce i campi che lo staff vede nel pannello /admin.
# Ogni collection legge/scrive i file .json in una cartella di content/,
# la stessa che legge il sito (src/lib/data/*.ts + src/lib/content-loader.ts).
#
# ATTIVAZIONE IN PRODUZIONE (passo esterno, da fare una volta sola):
# il backend "github" richiede un'app OAuth registrata su GitHub e un
# piccolo servizio "proxy" che gestisce il login (Decap fornisce un
# provider gratuito ospitabile su Vercel/Netlify in un minuto). Vedi
# la sezione "CMS" del README.md per il collegamento alla guida ufficiale
# e i valori esatti da inserire qui sotto (base_url, auth_endpoint).
#
# SVILUPPO LOCALE: lancia "npx decap-server" in un terminale e "npm run dev"
# in un altro; con local_backend: true qui sotto, il pannello scrive
# direttamente sui file locali senza bisogno di login GitHub.
# ============================================================================

local_backend: true

backend:
  name: github
  repo: YoungBrama/nettunogold_website
  branch: main

publish_mode: simple
media_folder: "public/eventi"
public_folder: "/eventi"

collections:
  - name: "eventi"
    label: "Tornei"
    folder: "content/eventi"
    extension: "json"
    format: "json"
    create: true
    slug: "{{fields.torneo.year}}-{{fields.torneo.month}}-{{fields.torneo.day}}-{{slug}}"
    summary: "{{fields.torneo.title}} — {{fields.torneo.day}}/{{fields.torneo.month}}/{{fields.torneo.year}}"
    identifier_field: "torneo.title"
    fields:
      - label: "Locandine (una o più immagini, mostrate nell'ordine in cui vengono aggiunte)"
        name: "images"
        widget: "list"
        required: false
        default: ["/eventi/placeholder-torneo.svg"]
        field: { label: "Immagine", name: "image", widget: "image" }

      - label: "🃏 Torneo"
        name: "torneo"
        widget: "object"
        fields:
          - { label: "Nome del torneo", name: "title", widget: "string" }
          - { label: "Giorno (GG)", name: "day", widget: "string", pattern: ["^(0[1-9]|[12]\\d|3[01])$", "Formato GG, es. 05"] }
          - { label: "Mese (MM)", name: "month", widget: "string", pattern: ["^(0[1-9]|1[0-2])$", "Formato MM, es. 09"] }
          - { label: "Anno (AAAA)", name: "year", widget: "string", pattern: ["^\\d{4}$", "Formato AAAA, es. 2026"] }
          - { label: "Orario (HH:MM)", name: "time", widget: "string", pattern: ["^([01]\\d|2[0-3]):[0-5]\\d$", "Formato HH:MM, es. 20:00"] }

      - label: "🏆 Serie e fase"
        name: "serie"
        widget: "object"
        required: false
        fields:
          - label: "Serie di appartenenza"
            name: "seriesSlug"
            widget: "relation"
            collection: "serie"
            search_fields: ["informazioni.title"]
            value_field: "slug"
            display_fields: ["informazioni.title"]
            required: false
          - { label: "Fase/flight (es. Day 1A, Final Day)", name: "phase", widget: "string", required: false }

      - label: "💰 Dettagli economici e di gioco"
        name: "dettagli"
        widget: "object"
        fields:
          - { label: "Buy-in (euro)", name: "buyIn", widget: "number", value_type: "float" }
          - { label: "Montepremi garantito (euro)", name: "guaranteed", widget: "number", value_type: "float", required: false }
          - { label: "Stack iniziale (chips)", name: "startingStack", widget: "number", value_type: "int", required: false }
          - { label: "Durata di un livello (minuti)", name: "levelDurationMinutes", widget: "number", value_type: "int", required: false }

      - { label: "Descrizione", name: "description", widget: "text", required: false }

  - name: "serie"
    label: "Serie / Festival"
    folder: "content/serie"
    extension: "json"
    format: "json"
    create: true
    slug: "{{slug}}"
    summary: "{{fields.informazioni.title}} — {{fields.informazioni.inizio.day}}/{{fields.informazioni.inizio.month}}/{{fields.informazioni.inizio.year}}"
    identifier_field: "informazioni.title"
    fields:
      - label: "📋 Informazioni"
        name: "informazioni"
        widget: "object"
        fields:
          - { label: "Nome della serie", name: "title", widget: "string" }
          - label: "Data inizio"
            name: "inizio"
            widget: "object"
            fields:
              - { label: "Giorno (GG)", name: "day", widget: "string", pattern: ["^(0[1-9]|[12]\\d|3[01])$", "Formato GG, es. 05"] }
              - { label: "Mese (MM)", name: "month", widget: "string", pattern: ["^(0[1-9]|1[0-2])$", "Formato MM, es. 09"] }
              - { label: "Anno (AAAA)", name: "year", widget: "string", pattern: ["^\\d{4}$", "Formato AAAA, es. 2026"] }
          - label: "Data fine (Final Day)"
            name: "fine"
            widget: "object"
            fields:
              - { label: "Giorno (GG)", name: "day", widget: "string", pattern: ["^(0[1-9]|[12]\\d|3[01])$", "Formato GG, es. 18"] }
              - { label: "Mese (MM)", name: "month", widget: "string", pattern: ["^(0[1-9]|1[0-2])$", "Formato MM, es. 09"] }
              - { label: "Anno (AAAA)", name: "year", widget: "string", pattern: ["^\\d{4}$", "Formato AAAA, es. 2026"] }
          - { label: "Montepremi garantito complessivo (euro)", name: "guaranteed", widget: "number", value_type: "float", required: false }

      - label: "🖼️ Media"
        name: "media"
        widget: "object"
        fields:
          - label: "Immagini (una o più, mostrate nell'ordine in cui vengono aggiunte)"
            name: "images"
            widget: "list"
            required: false
            default: ["/eventi/placeholder-torneo.svg"]
            field: { label: "Immagine", name: "image", widget: "image" }
          - { label: "Descrizione", name: "description", widget: "text" }

  - name: "news"
    label: "News"
    folder: "content/news"
    extension: "json"
    format: "json"
    create: true
    slug: "{{fields.date}}-{{slug}}"
    identifier_field: title
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "Data", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Categoria", name: "category", widget: "select", options: ["Risultati", "Comunicato", "Evento speciale"] }
      - { label: "Anteprima (excerpt)", name: "excerpt", widget: "text" }
      - { label: "Paragrafi", name: "body", widget: "list", field: { label: "Paragrafo", name: "paragraph", widget: "text" } }
      - label: "Immagini (una o più, mostrate nell'ordine in cui vengono aggiunte)"
        name: "images"
        widget: "list"
        required: false
        default: ["/news/placeholder-news.svg"]
        field: { label: "Immagine", name: "image", widget: "image" }

  - name: "classifiche"
    label: "Classifiche"
    folder: "content/classifiche"
    extension: "json"
    format: "json"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { label: "Titolo classifica", name: "title", widget: "string" }
      - { label: "Serie in corso", name: "seriesActive", widget: "boolean", default: true }
      - { label: "Ultimo aggiornamento", name: "updatedAt", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - label: "Classifica"
        name: "standings"
        widget: "list"
        fields:
          - { label: "Posizione", name: "position", widget: "number", value_type: "int" }
          - { label: "Nome giocatore", name: "playerName", widget: "string" }
          - { label: "Punti", name: "points", widget: "number", value_type: "int" }
          - { label: "Tornei giocati", name: "events", widget: "number", value_type: "int", default: 0 }
